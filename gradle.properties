# 2026-08-21 起沙箱已扩至 12GB/12核（原 3.4GB 限制作废），Robolectric 需 JDK 17-21
# JDK 路径由本机 ~/.gradle/gradle.properties 的 org.gradle.java.home 指定（勿提交进仓库）
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
