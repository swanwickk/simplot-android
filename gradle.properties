# 最省资源配置（3.4GB 内存沙箱）：
# - in-process 编译：不启动独立 Kotlin daemon（省 ~600MB）
# - 单 worker、daemon=false：避免多进程叠加吃内存
# - 小堆：Gradle 进程 Xmx768m 够用（依赖已缓存）
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
