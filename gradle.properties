# 2026-08-21 起沙箱已扩至 12GB/12核（原 3.4GB 限制作废），Robolectric 需 JDK 17-21
# 固定 Gradle 使用 JDK 21（系统默认 25 与 AGP 8.5.2 不兼容），提升堆以承载 Robolectric
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
